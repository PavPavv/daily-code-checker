<div
  class="toast"
  [ngClass]="{
    info: toastData.type === 'info',
    success: toastData.type === 'success',
    warning: toastData.type === 'warning'
  }"
  [@fadeAnimation]="{
    value: animationState,
    params: {
      fadeIn: toastConfig.animation?.fadeIn || 0,
      fadeOut: toastConfig.animation?.fadeOut || 0
    }
  }"
  (@fadeAnimation.done)="onFadeFinished($event)"
>
  <div class="text">{{ toastData.text }}</div>
  <mat-icon (click)="close()">close</mat-icon>
</div>

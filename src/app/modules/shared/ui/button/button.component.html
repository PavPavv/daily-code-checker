<ng-container *ngIf="type === 'primary' && !disabled">
  <button
    mat-flat-button
    class="btn btn--primary"
  >
    {{ text }}
  </button>
</ng-container>

<ng-container *ngIf="type === 'primary' && disabled">
  <button
    mat-flat-button
    disabled
    class="btn btn--primary"
  >
    {{ text }}
  </button>
</ng-container>

<ng-container *ngIf="type === 'nav'">
  <button
    mat-button
    class="btn btn--nav"
  >
    {{ text }}
  </button>
</ng-container>

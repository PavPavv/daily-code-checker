<form class="auth-form" [formGroup]="authForm">
  <app-input
    [type]="'email'"
    [ctrl]="getFormControl(authForm.get('email'))"
    name="email"
  />
  <app-input
    [type]="'password'"
    [ctrl]="getFormControl(authForm.get('password'))"
    name="password"
  />
  <app-button [text]="'Sign in'" />
</form>
